[project]
name = "normative-conformance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben", email = "ben.a.merritt@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "persist-queue>=1.1.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.alembic]
# The same location database.py resolves at runtime, as MIGRATIONS_LOCATION names it.
script_location = "normative_conformance:migrations"
prepend_sys_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--ignore=tests/migrations/versions"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: style errors and warnings
    "F",       # pyflakes: real bugs — undefined names, unused imports
    "I",       # isort: import sorting
    "UP",      # pyupgrade: modernize syntax to your Python version
    "B",       # bugbear: likely bugs — mutable default args, etc.
    "SIM",     # simplify: flags needlessly convoluted code
    "C4",      # comprehension improvements
    "PTH",     # use pathlib instead of os.path
    "RUF",     # ruff's own rules
    "ANN",     # REQUIRE type annotations on every function
    "FAST",    # FastAPI-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # don't force annotations on test functions

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
