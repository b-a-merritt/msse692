name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run pytest
