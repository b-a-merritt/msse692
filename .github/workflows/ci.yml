name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - name: Audit locked dependencies
        run: |
          uv export --format requirements-txt --no-emit-project --locked --output-file "$RUNNER_TEMP/audit.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/audit.txt" --disable-pip --vulnerability-service pypi
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/audit.txt" --disable-pip --vulnerability-service osv
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Run JavaScript unit tests
        run: node --test "tests/unit/static/**/test_*.mjs"
      - name: Enforce unit coverage
        run: uv run pytest tests/unit --cov=normative_conformance --cov-report=term-missing --cov-report=html:htmlcov/unit
      - name: Run integration tests and report combined coverage
        run: uv run pytest tests/integration --cov=normative_conformance --cov-append --cov-report=term-missing --cov-report=html:htmlcov/combined
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('htmlcov/**/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: htmlcov/
